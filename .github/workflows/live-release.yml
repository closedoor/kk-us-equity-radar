name: Live release acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: live-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install mobile Chromium test tooling
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.57.0
          npx --no-install playwright install --with-deps --only-shell chromium
      - name: Wait for Render and check the actual release
        env:
          RADAR_EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/live-release.cjs
